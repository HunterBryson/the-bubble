<!doctype html>
<meta charset="utf-8">
<!-- The bubble's face on screen: a slim tab on the right edge, and the panel that slides out of it. Fed by main.js. -->
<style>
:root{--ink:#f4f4f2;--dim:#a9afb8;--faint:#6b727c;--me:#6cc6ff;--caller:#f5a524;--green:#3fb950;--need:#ff9f43;--c:#3a3f47}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink);user-select:none;overflow:hidden}
#root{display:inline-flex;align-items:flex-start;padding:16px 0 18px 16px}
#tab{width:22px;height:110px;margin-top:20px;border-radius:12px 0 0 12px;background:#14171c;box-shadow:0 0 0 1px #2b3038,0 6px 18px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;position:relative;overflow:hidden}
#tab i{width:6px;height:44px;border-radius:3px;background:var(--c);display:block}
body.work #tab i,body.ring #tab i{background:linear-gradient(180deg,transparent,var(--c),transparent);background-size:100% 200%;animation:slide 1.4s linear infinite}
body.need #tab{animation:pulse 1.8s infinite}
#panel{display:none;width:340px;padding:14px 16px 14px;border-radius:16px 0 0 16px;background:linear-gradient(180deg,#191c22,#121418);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent),0 12px 30px rgba(0,0,0,.45);animation:in .28s ease-out}
body.open #panel{display:block}
body.open #tab{display:none}
body.need #panel{animation:in .28s ease-out,pulse 1.8s 0.3s infinite}
#who{display:flex;align-items:center;gap:10px;margin-bottom:9px;cursor:pointer}
#who .arrow{color:var(--faint);font-size:18px}
#who .nm{font-size:13px;color:var(--c);font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#who .tm{font-size:12px;color:var(--faint);font-weight:400;margin-left:6px}
#who .x{color:var(--faint);font-size:15px;padding:0 2px}
.face{position:relative;width:44px;height:44px;border-radius:50%;flex:none}
.face .pic{position:absolute;inset:4px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#071a26;background:radial-gradient(circle at 35% 30%,#ffffffaa,transparent 60%),var(--fc);background-size:cover;background-position:center}
.face .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--c),transparent 35%,var(--c) 55%,transparent 85%,var(--c));-webkit-mask:radial-gradient(circle,transparent 18px,#000 19px);animation:spin 2.6s linear infinite}
body.done .face .ring,body.quiet .face .ring{animation:none;background:var(--c)}
.caller{width:40px;height:40px}
.caller .pic{inset:0;box-shadow:0 0 0 3px #0b0c0e,0 0 0 5px var(--caller)}
#main{font-size:17px;font-weight:600;line-height:1.3}
#doing{font-size:13px;color:var(--faint);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#doing:empty{display:none}
#parts{display:flex;gap:4px;margin-top:9px}
#parts:empty{display:none}
#parts i{flex:1;height:4px;border-radius:2px;background:#2b3038;position:relative;overflow:hidden}
#parts i.did{background:color-mix(in srgb,var(--me) 55%,#000)}
#parts i.now{background:#1d3442}
#parts i.now::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--me),transparent);animation:sweep 1.6s ease-in-out infinite}
#partname{font-size:13px;color:var(--faint);margin-top:5px}
#partname:empty{display:none}
#reply{font-size:14px;color:#d9dad6;line-height:1.45;margin-top:6px;max-height:140px;overflow:hidden}
#reply:empty{display:none}
#asked{font-size:13px;color:var(--faint);margin-top:8px}
#asked:empty{display:none}
#asked em{color:var(--me);font-style:normal}
#btns{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
#btns:empty{display:none}
#btns b{font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;background:#23272f;border:1px solid #3a3f47;color:var(--ink);cursor:pointer}
#btns b.first{background:var(--c);color:#0b0c0e;border-color:transparent}
#words{display:none;font-size:13px;color:var(--dim);line-height:1.45;margin-top:8px;max-height:160px;overflow:auto;white-space:pre-wrap;user-select:text}
#words.show{display:block}
#today{margin-top:12px;padding-top:10px;border-top:1px solid #262a31}
#today:empty{display:none}
#today .row{display:flex;gap:8px;align-items:baseline;font-size:13.5px;color:var(--dim);padding:3px 0}
#today .row b{color:var(--ink);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#today .row .t{color:var(--faint);width:62px;flex:none}
#today .row .ok{color:var(--green)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes slide{from{background-position:0 100%}to{background-position:0 -100%}}
@keyframes in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 55%,transparent),0 12px 30px rgba(0,0,0,.45)}50%{box-shadow:0 0 0 10px transparent,0 12px 30px rgba(0,0,0,.45)}}
</style>
<div id="root">
  <div id="tab" title=""><i></i></div>
  <div id="panel">
    <div id="who"></div>
    <div id="main"></div>
    <div id="doing"></div>
    <div id="parts"></div><div id="partname"></div>
    <div id="reply"></div>
    <div id="asked"></div>
    <div id="btns"></div>
    <div id="words"></div>
    <div id="today"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m + ' min'; };
const clock = t => { const d = new Date(t); return d.toDateString() === new Date().toDateString() ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : 'Yesterday'; };
const COLOR = { quiet: '#3a3f47', ring: 'var(--caller)', work: 'var(--me)', need: 'var(--need)', done: 'var(--green)' };
let S = null;

function face(cls, name, color, img) {
  const bg = img ? `url(${img})` : color;
  return `<div class="face ${cls}" style="--fc:${bg}"><div class="ring"></div><div class="pic">${img ? '' : esc((name || '?')[0].toUpperCase())}</div></div>`;
}
function head() {
  const c = S.config, n = c.name;
  return { quiet: n, ring: `${S.call?.from || 'Someone'} is calling`, work: S.call ? `On a call with ${S.call.from}` : 'Working', need: `${n} needs you`, done: S.call ? 'Call done' : 'Done' }[S.mode];
}
function draw() {
  const c = S.config;
  document.body.className = S.mode + (S.open ? ' open' : '');
  document.documentElement.style.setProperty('--c', COLOR[S.mode]);
  document.documentElement.style.setProperty('--me', c.color || '#6cc6ff');
  const call = S.call && S.mode !== 'quiet';
  const tm = (S.mode === 'work' || S.mode === 'done') ? `<span class="tm">${ago(S.since)}</span>` : '';
  $('who').innerHTML = (call ? face('caller', S.call.from, 'var(--caller)', S.call.face) + '<span class="arrow">→</span>' : '') + face('', c.name, c.color, S.face) + `<span class="nm">${esc(head())}${tm}</span><span class="x" title="Tuck away">›</span>`;
  $('main').textContent = S.mode === 'quiet' ? 'Nothing going on.' : (S.main || '');
  $('doing').textContent = S.mode === 'work' ? (S.doing || '') : '';
  const parts = S.mode === 'work' ? S.parts : [];
  $('parts').innerHTML = parts.map((p, i) => `<i class="${i < S.now ? 'did' : i === S.now ? 'now' : ''}"></i>`).join('');
  $('partname').textContent = parts.length ? `Part ${S.now + 1} of ${parts.length} · ${parts[S.now] || ''}` : '';
  $('reply').textContent = S.mode === 'done' ? (S.reply && S.reply.trim() !== S.main ? S.reply.replace(/[#*_`>]/g, '').slice(0, 400) : '') : '';
  $('asked').innerHTML = !call && S.asked && S.mode !== 'quiet' ? `You asked: <em>${esc(S.asked.slice(0, 120))}</em>` : '';
  const b = [];
  if (S.mode === 'need') b.push('<b class="first" data-k="thanks">I did it</b>');
  if (S.mode === 'done' && S.sid && c.home) b.push('<b class="first" data-k="chat">Open this chat</b>');
  if (call && S.call.words) b.push(`<b data-k="words">What ${esc(S.call.from)} asked</b>`);
  $('btns').innerHTML = b.join('');
  $('words').textContent = call ? S.call.words : '';
  $('today').innerHTML = (S.mode === 'done' || S.mode === 'quiet') && S.today.length ? S.today.map(x => `<div class="row"><span class="t">${clock(x.at)}</span><b title="${esc(x.about)}">${esc(x.from)}: ${esc(x.about)}</b><span class="ok">✓</span></div>`).join('') : '';
  $('tab').title = head();
  requestAnimationFrame(report);
}
function report() { const r = $('root').getBoundingClientRect(); window.bubble.size(r.width, r.height); }
window.bubble.onState(s => { S = s; draw(); });
$('tab').onclick = () => window.bubble.click('tab');
document.addEventListener('click', e => {
  const k = e.target.closest('[data-k]')?.dataset.k;
  if (k === 'words') { $('words').classList.toggle('show'); requestAnimationFrame(report); return; }
  if (k) return window.bubble.click(k);
  if (e.target.closest('.x')) return window.bubble.click('tab');
});
</script>
